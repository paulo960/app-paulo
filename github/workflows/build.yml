name: Gerar APK Paulo Luna

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout do código
        uses: actions/checkout@v4

      - name: Configurar Java
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: Configurar Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.22.x'
          channel: 'stable'

      - name: Criar projeto Flutter base
        run: |
          flutter create --org com.pauloluna --project-name paulo_luna .
          flutter pub add shared_preferences flutter_overlay_window

      - name: Configurar Permissões no AndroidManifest
        run: |
          python3 -c "
          manifest = 'android/app/src/main/AndroidManifest.xml'
          with open(manifest, 'r') as f:
              content = f.read()
          perms = '''
              <uses-permission android:name=\"android.permission.SYSTEM_ALERT_WINDOW\"/>
              <uses-permission android:name=\"android.permission.FOREGROUND_SERVICE\"/>
              <uses-permission android:name=\"android.permission.FOREGROUND_SERVICE_SPECIAL_USE\"/>
              <uses-permission android:name=\"android.permission.WAKE_LOCK\"/>
          '''
          if 'SYSTEM_ALERT_WINDOW' not in content:
              content = content.replace('<application', perms + '\n    <application')
              with open(manifest, 'w') as f:
                  f.write(content)
          "

      - name: Compilar APK Release
        run: flutter build apk --release

      - name: Disponibilizar APK para Download
        uses: actions/upload-artifact@v4
        with:
          name: PauloLuna-App
          path: build/app/outputs/flutter-apk/app-release.apk
