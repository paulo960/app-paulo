name: Gerar APK Assinado Time App

on:
  push:
    branches: [ "main" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Configurar Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: Configurar Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.22.3'
          channel: 'stable'

      - name: Gerar estrutura nativa Android
        run: |
          rm -rf android
          flutter create . --platforms=android --org com.pauloluna --project-name app_paulo_luna

      - name: Configurar manifesto (Nome e Permissoes)
        run: |
          sed -i '/<application/i \    <uses-permission android:name="android.permission.POST_NOTIFICATIONS"/>\n    <uses-permission android:name="android.permission.FOREGROUND_SERVICE"/>' android/app/src/main/AndroidManifest.xml
          sed -i 's/android:label=".*"/android:label="Time App"/' android/app/src/main/AndroidManifest.xml

      - name: Gerar Keystore de Release Oficial
        run: |
          keytool -genkeypair -v \
            -keystore upload-keystore.jks \
            -keyalg RSA \
            -keysize 2048 \
            -validity 10000 \
            -alias upload \
            -storepass "PauloLunaApp2026" \
            -keypass "PauloLunaApp2026" \
            -dname "CN=Paulo Luna, OU=Mobile, O=PauloLuna, L=Goiania, ST=GO, C=BR"

      - name: Instalar dependencias Flutter
        run: flutter pub get

      - name: Compilar APK
        run: flutter build apk --release

      - name: Assinar APK Oficialmente (apksigner)
        run: |
          $ANDROID_SDK_ROOT/build-tools/34.0.0/apksigner sign \
            --ks upload-keystore.jks \
            --ks-pass pass:PauloLunaApp2026 \
            --ks-key-alias upload \
            --key-pass pass:PauloLunaApp2026 \
            --out build/app/outputs/flutter-apk/app-release-signed.apk \
            build/app/outputs/flutter-apk/app-release.apk

      - name: Disponibilizar APK para Download
        uses: actions/upload-artifact@v4
        with:
          name: TimeApp-Assinado-Release
          path: build/app/outputs/flutter-apk/app-release-signed.apk
