name: Gerar APK Assinado Time App

on:
  push:
    branches: [ "main" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Configurar Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: Configurar Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.22.3'
          channel: 'stable'

      - name: Gerar estrutura nativa Android limpa
        run: |
          rm -rf android
          flutter create . --platforms=android --org com.pauloluna --project-name app_paulo_luna

      - name: Configurar manifesto (Nome e Permissoes)
        run: |
          sed -i '/<application/i \    <uses-permission android:name="android.permission.POST_NOTIFICATIONS"/>\n    <uses-permission android:name="android.permission.FOREGROUND_SERVICE"/>' android/app/src/main/AndroidManifest.xml
          sed -i 's/android:label=".*"/android:label="Time App"/' android/app/src/main/AndroidManifest.xml

      - name: Gerar Keystore de Release Proprio
        run: |
          keytool -genkeypair -v \
            -keystore android/app/upload-keystore.jks \
            -keyalg RSA \
            -keysize 2048 \
            -validity 10000 \
            -alias upload \
            -storepass "PauloLunaApp2026" \
            -keypass "PauloLunaApp2026" \
            -dname "CN=Paulo Luna, OU=Mobile, O=PauloLuna, L=Goiania, ST=GO, C=BR"

          cat << 'EOF' > android/key.properties
          storePassword=PauloLunaApp2026
          keyPassword=PauloLunaApp2026
          keyAlias=upload
          storeFile=upload-keystore.jks
          EOF

      - name: Configurar build.gradle para Assinatura de Release Real
        run: |
          python3 -c "
          import re

          with open('android/app/build.gradle', 'r') as f:
              gradle = f.read()

          header = '''def keystoreProperties = new Properties()
          def keystorePropertiesFile = rootProject.file('key.properties')
          if (keystorePropertiesFile.exists()) {
              keystoreProperties.load(new FileInputStream(keystorePropertiesFile))
          }
          '''
          gradle = header + gradle

          signing_block = '''
              signingConfigs {
                  release {
                      keyAlias keystoreProperties['keyAlias']
                      keyPassword keystoreProperties['keyPassword']
                      storeFile keystoreProperties['storeFile'] ? file(keystoreProperties['storeFile']) : null
                      storePassword keystoreProperties['storePassword']
                  }
              }
          '''

          gradle = re.sub(r'android\s*\{', 'android {\n' + signing_block, gradle, count=1)
          gradle = re.sub(r'signingConfig\s+signingConfigs\.debug', 'signingConfig signingConfigs.release', gradle)

          with open('android/app/build.gradle', 'w') as f:
              f.write(gradle)
          "

      - name: Instalar dependencias Flutter
        run: flutter pub get

      - name: Compilar APK Release Assinado
        run: flutter build apk --release

      - name: Disponibilizar APK para Download
        uses: actions/upload-artifact@v4
        with:
          name: TimeApp-Assinado-Release
          path: build/app/outputs/flutter-apk/app-release.apk
